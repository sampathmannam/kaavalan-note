[versions]
agp = "8.7.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
room = "2.6.1"
sqlcipher = "4.6.1"
securityCrypto = "1.1.0-alpha06"
coroutines = "1.9.0"
serialization = "1.7.3"
datetime = "0.6.1"
work = "2.9.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
material3 = "1.3.1"
navigationCompose = "2.8.4"
core = "1.13.1"
junit = "4.13.2"
androidxJunit = "1.2.1"
# v2.1.2: androidx.test:rules (GrantPermissionRule), pinned to match the
# androidx.test:runner/core version already resolved via androidx-junit
# + espresso-core's transitive graph, so this doesn't introduce a second
# androidx.test version to reconcile.
androidxTestRules = "1.6.1"
espresso = "3.6.1"
robolectric = "4.13"
hilt-android-testing = "2.52"
supabase = "3.1.1"
ktor = "3.0.3"
turbine = "1.1.0"
mockk = "1.13.13"
okhttp = "4.12.0"
ndk = "27.3.13750724"
llamaCpp = "b4600"
mlkitTextRecognition = "16.0.1"
camerax = "1.4.0"
# v2.1.0 (PM rating): Google Sign-In for the Google
# Drive backup flow. 21.2.0 is the current stable as of
# 2025-Q4; the WhatsApp-style backup flow uses the
# GoogleSignInClient to request the
# `drive.appdata` scope, then calls the Drive REST API
# with the resulting access token.
playServicesAuth = "21.2.0"
# v2.1.0: AndroidX Browser for the OAuth Custom Tabs
# flow (the alternative to Google Sign-In if Play
# Services Auth is not available). The user opens a
# Chrome Custom Tab to Google's OAuth page, signs in,
# grants the `drive.appdata` scope, and Google
# redirects to a custom scheme Baton catches.
browser = "1.8.0"
# Tier 0.1 (Glance widget). Glance 1.1.1 ships with the
# compose-bom 2024.10.01 baseline; bump together if either moves.
glance = "1.1.1"
argon2kt = "1.6.0"
datastore = "1.1.1"

