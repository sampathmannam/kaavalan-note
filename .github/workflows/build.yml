name: Baton Android CI

# v1.9.7 (CI-002): CodeRabbit review caught that the workflow had
# no `permissions` block. Restrict GITHUB_TOKEN to read-only at the
# top level, and pass `persist-credentials: false` to every
# `actions/checkout` step so the token isn't written to the local
# git config (gradle executes repo code on the self-hosted runner
# and a compromised build could otherwise exfiltrate the token).
permissions:
  contents: read

on:
  push:
    branches: [main, master, 'm0/**', 'work/**', 'chore/**', 'fix/**', 'docs/**', 'test/**']
    tags: ['v*']
  pull_request:
    branches: [main, master, 'm0/**']

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
  # macOS runners don't set ANDROID_HOME / JAVA_HOME the way the
  # developer's local shell does. The setup-android + setup-java
  # steps below write to $GITHUB_ENV; we source them via the gradle
  # invocation rather than re-exporting here.

jobs:
  unit-test:
    name: Unit tests (testDebugUnitTest)
    runs-on: [self-hosted, macOS, ARM64, baton]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          # v1.9.7: persist-credentials: false — see the top-level
          # `permissions` block comment for the rationale.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The developer's Mac (the runner host) already has a full
      # Android SDK at $HOME/Library/Android/sdk with all the
      # platforms and build-tools the project needs. The CI just
      # exports ANDROID_HOME; no setup-android action is required.
      # (android-actions/setup-android@v3 ignores ANDROID_HOME and
      # re-downloads the SDK to ~/.android/sdk, which adds ~10 min
      # of install time on a slow link.)
      - name: Export Android SDK path
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          test -d "$HOME/Library/Android/sdk" || (echo "::error::No SDK at $HOME/Library/Android/sdk" && exit 1)
          echo "Android SDK at $HOME/Library/Android/sdk OK"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          # v1.9.7: do NOT cache `app/build` — the test-results and
          # html reports inside grow to 100+ MB and the cache upload
          # step exceeds the 30-minute job timeout. The `~/.gradle/caches`
          # and `~/.gradle/wrapper` paths alone give ~95% of the speedup.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # v1.9.7 (CI-001): Robolectric upgraded from 4.13 -> 4.14.1
      # to fix the runOnMainThread hang on JDK 17 + ARM64 Mac
      # (MethodCallProxy.apply park). 4.14.1 changelog has the
      # fix. If the hang returns, this is the line to investigate.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace -PBATON_SUPABASE_URL=https://placeholder.supabase.co -PBATON_SUPABASE_ANON_KEY=placeholder-anon-key-for-ci-only

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  lint:
    name: Kotlin lint (ktlint + detekt if present)
    runs-on: [self-hosted, macOS, ARM64, baton]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Export Android SDK path
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          test -d "$HOME/Library/Android/sdk" || (echo "::error::No SDK at $HOME/Library/Android/sdk" && exit 1)

      # v1.9.7 (CI-003): CodeRabbit review caught the `|| echo`
      # below — that swallows every gradle failure (including gradle
      # itself crashing, SDK download errors, ktlint not installed)
      # and reports the lint job as green. The intent was "warn on
      # lint issues but pass on build errors"; the right tool is
      # `continue-on-error: true` on the lint step, with the upload
      # step still conditional on `always()`. That way gradle's exit
      # code is preserved when a real error happens, but ktlint
      # warnings don't fail the job.
      # v2.1.2 (release-integrity): `continue-on-error: true` removed.
      # It was added because lint reported 525 errors, 522 of them the
      # known/accepted `MissingTranslation` set. Those are now
      # `informational` in app/build.gradle.kts, so the report is
      # actionable and lint can gate again. It was hiding a real
      # `NewApi` crash (voice capture on every pre-Android-13 device).
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon -PBATON_SUPABASE_URL=https://placeholder.supabase.co -PBATON_SUPABASE_ANON_KEY=placeholder-anon-key-for-ci-only

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 14

  assemble:
    name: Assemble debug APK
    runs-on: [self-hosted, macOS, ARM64, baton]
    timeout-minutes: 30
    needs: [unit-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Export Android SDK path
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          test -d "$HOME/Library/Android/sdk" || (echo "::error::No SDK at $HOME/Library/Android/sdk" && exit 1)

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -PBATON_SUPABASE_URL=https://placeholder.supabase.co -PBATON_SUPABASE_ANON_KEY=placeholder-anon-key-for-ci-only

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # v1.9.11 (A7 audit fix): debug APK size budget. The release
      # build's online dependency resolution fails in the CI's
      # offline mode; the debug variant is what we can measure
      # without network. The release APK is the same code through
      # R8 minify + resource shrink, so the debug 47 MB is the
      # upper bound. The release size is ~32 MB (a 32% shrink)
      # — this budget is a guard against future regressions.
      - name: Debug APK size budget (40 MB)
        run: |
          set -e
          DEBUG_APK=app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::No debug APK at $DEBUG_APK"
            exit 1
          fi
          SIZE_BYTES=$(stat -f%z "$DEBUG_APK" 2>/dev/null || stat -c%s "$DEBUG_APK")
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Debug APK size: ${SIZE_MB} MB (budget: 40 MB)"
          if [ "$SIZE_MB" -gt 40 ]; then
            echo "::error::Debug APK exceeds 40 MB budget (${SIZE_MB} MB)"
            exit 1
          fi
          echo "OK — within budget"

  # v2.1.2 (release-integrity): the release build gate.
  #
  # Until now CI built only `assembleDebug`. The debug variant
  # does not run R8, so nothing in the pipeline ever exercised
  # minification, resource shrinking, the per-ABI splits or
  # `lintVitalRelease` — the stages where release-only crashes
  # come from. Two defects lived in `main` because of that gap:
  #
  #   * `assembleRelease` failed outright at
  #     `validateSigningRelease` on any clean checkout (the
  #     keystore was scrubbed in v2.1.0 but `build.gradle.kts`
  #     still hard-coded its path), so no release artifact could
  #     be produced at all; and
  #   * every app-specific `-keep` rule in `proguard-rules.pro`
  #     still named the pre-v2.1.1 `com.baton.app` package and
  #     therefore matched nothing.
  #
  # Neither was visible from a debug build. This job closes that.
  # It deliberately runs WITHOUT signing secrets: the signing
  # config resolves to nothing, AGP emits unsigned APKs, and R8
  # plus every other release stage still runs. Signing happens at
  # release time on a machine that holds the key.
  assemble-release:
    name: Assemble release APK (R8)
    runs-on: [self-hosted, macOS, ARM64, baton]
    timeout-minutes: 45
    needs: unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Export Android SDK path
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          test -d "$HOME/Library/Android/sdk" || (echo "::error::No SDK at $HOME/Library/Android/sdk" && exit 1)

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble release APK (R8 + shrink + splits)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # The whole point of the job: prove R8 actually produced the
      # per-ABI artifacts. A silent R8 failure that still exits 0
      # would otherwise look like a pass.
      - name: Verify release artifacts exist
        run: |
          set -e
          OUT=app/build/outputs/apk/release
          MISSING=0
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            # The basename differs by whether signing was configured.
            if ls "$OUT"/app-$ABI-release*.apk >/dev/null 2>&1; then
              F=$(ls "$OUT"/app-$ABI-release*.apk | head -1)
              SIZE_MB=$(( $(stat -f%z "$F" 2>/dev/null || stat -c%s "$F") / 1024 / 1024 ))
              echo "OK  $ABI -> $(basename "$F") (${SIZE_MB} MB)"
            else
              echo "::error::No release APK for $ABI in $OUT"
              MISSING=1
            fi
          done
          exit $MISSING

      # arm64-v8a is the ABI virtually every current device uses,
      # and it is the one Play delivers from the bundle. 40 MB is
      # comfortably above the ~25 MB the R8 build currently
      # produces, so this catches a regression rather than
      # policing normal drift.
      - name: Release APK size budget (40 MB, arm64-v8a)
        run: |
          set -e
          F=$(ls app/build/outputs/apk/release/app-arm64-v8a-release*.apk | head -1)
          SIZE_MB=$(( $(stat -f%z "$F" 2>/dev/null || stat -c%s "$F") / 1024 / 1024 ))
          echo "Release arm64-v8a APK: ${SIZE_MB} MB (budget: 40 MB)"
          if [ "$SIZE_MB" -gt 40 ]; then
            echo "::error::Release APK exceeds 40 MB budget (${SIZE_MB} MB)"
            exit 1
          fi
          echo "OK — within budget"

      - name: Upload release APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # R8's mapping file is the only way to read a release stack
      # trace. Losing it means a crash report from a user is
      # unreadable, so keep it with the build that produced it.
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

  # v1.9.11 (A3 audit fix): the connected-device androidTest
  # job. This runs the M0AcceptanceTest and VaultEndToEndTest
  # suites (which live under `app/src/androidTest/java/`) on
  # a real device connected to the self-hosted runner.
  #
  # The job is OPTIONAL — if no device is connected, the job
  # exits early with a `skipped` result. This is the right
  # shape for a self-hosted runner that sometimes has a
  # device and sometimes doesn't; it does not block the
  # release pipeline.
  #
  # To add a new androidTest class: drop it into
  # `app/src/androidTest/java/` and the gradle task below
  # picks it up automatically. See the existing
  # `M0AcceptanceTest` for the harness pattern.
  android-test:
    name: Connected-device androidTest
    runs-on: [self-hosted, macOS, ARM64, baton]
    timeout-minutes: 60
    needs: [assemble]
    # If no device is connected, the device check below sets
    # this output to `skipped`. The CI pipeline continues —
    # androidTest is a drive-verify layer, not a release
    # gate. The unit-test + assemble jobs are the gate.
    continue-on-error: false
    outputs:
      device_attached: ${{ steps.device_check.outputs.attached }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Export Android SDK + ADB
        run: |
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "PATH=$HOME/Library/Android/sdk/platform-tools:$PATH" >> $GITHUB_ENV
          test -d "$HOME/Library/Android/sdk" || (echo "::error::No SDK at $HOME/Library/Android/sdk" && exit 1)

      - name: Check for a connected device
        id: device_check
        run: |
          set +e
          adb devices -l
          COUNT=$(adb devices | grep -E "device$" | wc -l | tr -d ' ')
          echo "Detected $COUNT device(s)"
          if [ "$COUNT" -gt 0 ]; then
            echo "attached=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Android device connected to the self-hosted runner. "\
                  "Skipping the connectedAndroidTest job. The androidTest classes "\
                  "still build and pass locally; this job is for drive-verify on a "\
                  "physical device."
            echo "attached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run connectedAndroidTest
        if: steps.device_check.outputs.attached == 'true'
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace -PBATON_SUPABASE_URL=https://placeholder.supabase.co -PBATON_SUPABASE_ANON_KEY=placeholder-anon-key-for-ci-only

      - name: Upload androidTest results
        if: always() && steps.device_check.outputs.attached == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          retention-days: 14

      - name: Skip notice
        if: steps.device_check.outputs.attached == 'false'
        run: |
          echo "::notice::Skipped connectedAndroidTest — no device connected. "\
                "The androidTest classes are still built by gradle but not "\
                "executed. Run \`./gradlew :app:connectedDebugAndroidTest\` "\
                "locally with a device attached to drive-verify."
